<h1>L甲鉄城のカバネリ 海門決戦</h1>
<p>総ゲーム数</p>
<input type="number" id="totalGames" min="0">
<p>通常ゲーム数</p>
<input type="number" id="games">
<p>下段ベル回数</p>
<input type="number" id="small">
<p>ボーナス初当たり回数</p>
<input type="number" id="bb">
<p>AT初当たり回数</p>
<input type="number" id="at" min="0">
<p>初当たり判別モード</p>
<select id="mode">
  <option value="bonus">ボーナス初当たり</option>
  <option value="at">AT初当たり</option>
  <option value="both">AT＋ボーナス初当たり（両方使用）</option>
</select>
<fieldset>
  <legend>非高確単チャンス目発光率(無名/生駒)</legend>

  <label>
    単チャンス目成立回数：
    <input type="number" id="singleChance" min="0" value="0">
  </label>

  <label>
    発光回数：
    <input type="number" id="singleLight" min="0" value="0">
  </label>

  <p id="singleLightRate">発光率：0.0%</p>
  <small>※独自推定値を使用</small>
</fieldset>
<button type="button" class="analyzeButton">設定判別する</button>
<div id="topResult"></div>
<fieldset>
  <legend>キャラ紹介（0〜5000G）</legend>
  <style>
  fieldset label {
    display: block;
    margin: 10px 0;
  }
</style>

  <label>
    女性キャラ：
    <input type="number" id="femaleCount" min="0" value="0">
  </label>

  <label>
    男性キャラ：
<input type="number" id="maleCount" min="0" value="0">
</label>

<p id="characterRate">女性：0.0% / 男性：0.0%</p>
</fieldset>
<fieldset>
  <legend>復讐の焔 成功時の裏景之ST突入率</legend>

  <label>
    復讐の焔 成功回数：
    <input type="number" id="revengeSuccess" min="0" value="0">
  </label>

  <label>
    裏景之ST突入回数：
    <input type="number" id="uraKeiyuki" min="0" value="0">
  </label>

  <p id="uraRate">裏景之ST突入率：0.0%</p>
</fieldset>

<fieldset id="settingHints">
  <legend>設定確定・示唆演出（複数選択可）</legend>

  <style>
    #settingHints label {
      display: block;
      margin: 8px 0;
    }
  </style>

 <div id="hintOptions">
  <h3>サミートロフィー</h3>

  <label><input type="checkbox" class="hint" value="trophy2">銅（設定2以上）</label>
  <label><input type="checkbox" class="hint" value="trophy3">銀（設定3以上）</label>
  <label><input type="checkbox" class="hint" value="trophy4">金（設定4以上）</label>
  <label><input type="checkbox" class="hint" value="trophy5">キリン柄（設定5以上）</label>
  <label><input type="checkbox" class="hint" value="trophy6">虹（設定6）</label>
  <h3>アイテムくじ</h3>

<label><input type="checkbox" class="hint" value="kuji2">小吉（設定2以上）</label>
<label><input type="checkbox" class="hint" value="kuji4">中吉（設定4以上）</label>
<label><input type="checkbox" class="hint" value="kuji6">大吉（設定6）</label>
<label><input type="checkbox" class="hint" value="kujiNo23">来栖の刀（設定2・3否定）</label>
<label><input type="checkbox" class="hint" value="kujiNo13">無名のけん玉（設定1・3否定）</label>
</div><h3>その他の設定確定演出</h3>

<label><input type="checkbox" class="hint" value="over4">456 OVER（設定4以上）</label>
<label><input type="checkbox" class="hint" value="over6">666 OVER（設定6）</label>
<label><input type="checkbox" class="hint" value="swimsuit">ST終了画面・水着（設定6）</label>
<label><input type="checkbox" class="hint" value="biba">ボーナス中・美馬紹介（設定4以上）</label>
<label><input type="checkbox" class="hint" value="attack4">カバネリアタック＋44（設定4以上）</label>
<label><input type="checkbox" class="hint" value="attack5">カバネリアタック＋55（設定5以上）</label>
<label><input type="checkbox" class="hint" value="attack6">カバネリアタック＋66・＋77（設定6）</label>
</fieldset>
<button type="button" id="analyzeButton">設定判別する</button>
<button type="button" id="clearHints">確定演出のチェックをすべて外す</button>

<p id="bonusRate">ボーナス初当たり確率：未計算</p>
<p id="atRate">AT初当たり確率：未計算</p>
<p id="bellRate">下段ベル確率：未計算</p>
<p id="result"></p>


<script>
document.getElementById("clearHints").onclick = function() {
  document.querySelectorAll(".hint").forEach(input => {
    input.checked = false;
  });
};
function analyze(event) {
  const games = Number(document.getElementById("games").value);
  const totalGames = Number(document.getElementById("totalGames").value);
  const small = Number(document.getElementById("small").value);
  const bb = Number(document.getElementById("bb").value);
  const at = Number(document.getElementById("at").value);
  const mode = document.getElementById("mode").value;
  const femaleCount = Number(document.getElementById("femaleCount").value);
const maleCount = Number(document.getElementById("maleCount").value);
const characterTotal = femaleCount + maleCount;

const femalePercent = characterTotal > 0
  ? (femaleCount / characterTotal * 100).toFixed(1)
  : "0.0";

const malePercent = characterTotal > 0
  ? (maleCount / characterTotal * 100).toFixed(1)
  : "0.0";

document.getElementById("characterRate").textContent =
  `女性：${femalePercent}% / 男性：${malePercent}%`;
const femaleRates = [0.500, 0.575, 0.415, 0.585, 0.399, 0.600];
const maleRates = [0.500, 0.425, 0.585, 0.414, 0.600, 0.3985];
const revengeSuccess = Number(document.getElementById("revengeSuccess").value);
const uraKeiyuki = Number(document.getElementById("uraKeiyuki").value);

const uraRates = [0.062, 0.062, 0.066, 0.109, 0.250, 0.332];
const singleChance = Number(document.getElementById("singleChance").value);
const singleLight = Number(document.getElementById("singleLight").value);

// 独自推定値（設定1〜6）
const singleLightRates = [0.10, 0.12, 0.14, 0.16, 0.18, 0.20];
const singleLightPercent = singleChance > 0
  ? (singleLight / singleChance * 100).toFixed(1)
  : "0.0";

document.getElementById("singleLightRate").textContent =
  `発光率：${singleLightPercent}%`;
const uraPercent = revengeSuccess > 0
  ? (uraKeiyuki / revengeSuccess * 100).toFixed(1)
  : "0.0";

document.getElementById("uraRate").textContent =
  `裏景之ST突入率：${uraPercent}%`;
  const selectedHints = Array.from(
  document.querySelectorAll(".hint:checked")
).map(input => input.value);
  document.getElementById("bellRate").textContent =
  "下段ベル確率： " +
  (small > 0 ? "1/" + (totalGames / small).toFixed(1) : "当選なし");
  document.getElementById("atRate").textContent =
  "AT初当たり確率： " +
  (at > 0 ? "1/" + (games / at).toFixed(1) : "当選なし");
const firstHit = bb;
document.getElementById("bonusRate").textContent =
  "ボーナス初当たり確率： " +
  (firstHit > 0 ? "1/" + (games / firstHit).toFixed(1) : "当選なし");
const result = document.getElementById(
  event.currentTarget.classList.contains("analyzeButton")
    ? "topResult"
    : "result"
);
  if (
    games <= 0 ||
![games, small, bb, at].every(Number.isInteger) ||
[small, bb, at].some(n => n < 0) ||
small > totalGames || bb > games || at > games

) {
    result.textContent = "正しい数値を入力してください";
    return;
  }

  // 設定別の架空確率（練習用）
  const atRates = [
  422.5,
  405.9,
  398.7,
  357.2,
  332.6,
  318.5
];
  const bellRates = [
  121.1,
  114.4,
  112.8,
  106.2,
  104.2,
  99.1
];
 const rates = [
  [10.5, 254.2, 400, 0.20],
  [10.3, 242.3, 370, 0.22],
  [10.1, 239.6, 340, 0.24],
  [9.9, 214.0, 300, 0.27],
  [9.7, 203.2, 270, 0.30],
  [9.5, 195.1, 240, 0.32]
];
  function logBinomial(n, k, rate) {
    const p = 1 / rate;
    return k * Math.log(p) +
      (n - k) * Math.log1p(-p);
  }
const atScores = atRates.map(rate =>
  logBinomial(games, at, rate)
);
const scores = rates.map(([s, b, r, cz], i) => {
  const bonusScore = logBinomial(games, firstHit, b);

  const hitScore =
    mode === "at" ? atScores[i] :
    mode === "bonus" ? bonusScore :
    (atScores[i] + bonusScore) / 2;

const characterScore =
  femaleCount * Math.log(femaleRates[i]) +
  maleCount * Math.log(maleRates[i]);

return hitScore +
logBinomial(totalGames, small, bellRates[i])+
 characterScore +
logBinomial(revengeSuccess, uraKeiyuki, 1 / uraRates[i]) +
2.5 * logBinomial(singleChance, singleLight, 1 / singleLightRates[i]);
});

const hintRules = {
  trophy2: [2, 3, 4, 5, 6],
  trophy3: [3, 4, 5, 6],
  trophy4: [4, 5, 6],
  trophy5: [5, 6],
  trophy6: [6],

  kuji2: [2, 3, 4, 5, 6],
  kuji4: [4, 5, 6],
  kuji6: [6],
  kujiNo23: [1, 4, 5, 6],
  kujiNo13: [2, 4, 5, 6],

  over4: [4, 5, 6],
  over6: [6],
  swimsuit: [6],
  biba: [4, 5, 6],
  attack4: [4, 5, 6],
  attack5: [5, 6],
  attack6: [6]
};

const allowedSettings = [1, 2, 3, 4, 5, 6].filter(setting =>
  selectedHints.every(hint =>
    !hintRules[hint] || hintRules[hint].includes(setting)
  )
);

if (allowedSettings.length === 0) {
  result.textContent = "確定演出の条件が矛盾しています。選択内容を確認してください。";
  return;
}

for (let i = 0; i < 6; i++) {
  if (!allowedSettings.includes(i + 1)) {
    scores[i] = -Infinity;
  }
}
  const max = Math.max(...scores);
  const weights = scores.map(s => Math.exp(s - max));
  const total = weights.reduce((a, b) => a + b, 0);

  result.innerHTML = "";

  weights.forEach((w, i) => {
    const line = document.createElement("p");
    line.textContent =
      `設定${i + 1}：${(w / total * 100).toFixed(2)}%`;
    result.appendChild(line);
  });
};
document.querySelectorAll(".analyzeButton, #analyzeButton").forEach(button => {
  button.onclick = analyze;
});
</script>
<style>
  body {
  background-color: #101c32;
  color: #f3f8ff;
  font-family: sans-serif;
  padding: 16px;
}

h1, legend {
  color: #a9d6ff;
}

fieldset {
  background-color: #1d304d;
}
.analyzeButton, #analyzeButton {
  background-color: #1671b9;
  color: white;
  border: none;
  border-radius: 10px;
  padding: 14px 24px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  margin: 10px 0;
}
#clearHints {
  background-color: #536579;
  color: white;
  border: none;
  border-radius: 10px;
  padding: 12px 18px;
  font-size: 14px;
  cursor: pointer;
}
#topResult:not(:empty),
#result:not(:empty) {
  background-color: #1d304d;
  border: 1px solid #448ac0;
  border-radius: 12px;
  padding: 16px;
  margin: 12px 0 20px;
}

#topResult p,
#result p {
  padding: 8px 0;
  margin: 0;
  border-bottom: 1px solid #38516d;
}

#topResult p:last-child,
#result p:last-child {
  border-bottom: none;
}
  input[type="number"], select {
    width: 100%;
    max-width: 350px;
    box-sizing: border-box;
    padding: 12px;
    margin: 6px 0 14px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 16px;
  }

  fieldset {
    margin: 20px 0;
    padding: 16px;
    border: 1px solid #ddd;
    border-radius: 12px;
  }

  legend {
    font-weight: bold;
    padding: 0 8px;
  }
</style>
